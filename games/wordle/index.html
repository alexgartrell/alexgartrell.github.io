<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordle · Games</title>
  <link rel="stylesheet" href="../shared/grid.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="../shared/ui.js"></script>
  <script defer src="words.js"></script>
  <script defer src="engine.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main aria-label="Wordle">
    <nav class="toolbar" aria-label="Game controls">
      <a href="../index.html">← Games</a>
      <span class="title">Wordle</span>
      <button id="new-game">New game</button>
      <span id="stats"></span>
    </nav>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="playfield">
      <div id="grid" class="grid" role="group" tabindex="0" aria-label="Six guesses, five letters each"></div>
    </div>
    <div id="keyboard" aria-label="Letter keyboard" role="group"></div>
    <noscript>Enable JavaScript to play.</noscript>
  </main>
</body>
</html>
