<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spider Solitaire · Games</title>
  <link rel="stylesheet" href="../../css/index.css"><link rel="stylesheet" href="../shared/cards.css">
  <script defer src="engine.js"></script><script defer src="../shared/cards.js"></script>
</head>
<body data-game="spider" style="--columns: 10">
  <main class="game-wrap" aria-label="Spider Solitaire">
    <nav class="toolbar" aria-label="Game controls">
      <a href="../index.html">← Games</a><select id="mode" aria-label="Number of suits"><option value="1">1 suit</option><option value="2">2 suits</option><option value="4">4 suits</option></select><button id="new-game">New game</button><button id="undo" disabled>Undo</button><span id="stats"></span>
    </nav>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="board" aria-label="Spider Solitaire table"><div id="top-row" class="top-row"></div><div id="tableau" class="tableau"></div></div>
    <noscript>Enable JavaScript to play.</noscript>
  </main>
</body>
</html>
