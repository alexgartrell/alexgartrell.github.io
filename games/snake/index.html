<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake · Games</title><link rel="stylesheet" href="../shared/grid.css"><link rel="stylesheet" href="style.css">
<script defer src="../shared/ui.js"></script><script defer src="engine.js"></script><script defer src="app.js"></script>
</head><body><main aria-label="Snake">
<nav class="toolbar" aria-label="Game controls"><a href="../index.html">← Games</a><span class="title">Snake</span><button id="new-game">New game</button><select id="speed" aria-label="Speed"><option value="160">Slow</option><option value="110" selected>Normal</option><option value="75">Fast</option></select><button id="pause">Start</button><span id="stats"></span></nav>
<p id="status" role="status" aria-live="polite"></p>
<div class="playfield"><div id="grid" class="grid" aria-label="Snake board"></div></div>
<div class="controls" aria-label="Steer snake"><button data-dir="left" aria-label="Turn left">←</button><button data-dir="up" aria-label="Turn up">↑</button><button data-dir="down" aria-label="Turn down">↓</button><button data-dir="right" aria-label="Turn right">→</button></div><noscript>Enable JavaScript to play.</noscript>
</main></body></html>
